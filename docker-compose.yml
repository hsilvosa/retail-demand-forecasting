x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  volumes:
    - ./data:/workspace/data:ro
    - ./lakehouse:/workspace/lakehouse
    - ./artifacts:/workspace/artifacts
    - ./state:/workspace/state
    - ./notebooks:/workspace/notebooks
  networks: [retail]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [retail]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-local-only}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [retail]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/scripts/init-minio.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-local-only}
    volumes: ["./scripts:/scripts:ro"]
    networks: [retail]

  mlflow:
    <<: *app
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=localhost:*,mlflow:*,127.0.0.1:*
      - --backend-store-uri=postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow-local-only}@postgres:5432/${POSTGRES_DB:-mlflow}
      - --artifacts-destination=s3://mlflow-artifacts
    ports: ["5000:5000"]
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  spark-master:
    <<: *app
    command: ["spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    ports: ["7077:7077", "8080:8080"]

  spark-worker:
    <<: *app
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 12
      SPARK_WORKER_MEMORY: 12g
    depends_on: [spark-master]

  pipeline:
    <<: *app
    command: ["retail-forecast", "pipeline", "run", "--profile", "dev"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      mlflow: {condition: service_healthy}
      spark-master: {condition: service_started}

  jupyter:
    <<: *app
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--ServerApp.token="]
    ports: ["8888:8888"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      mlflow: {condition: service_healthy}

  dashboard:
    <<: *app
    command: ["streamlit", "run", "app/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["8501:8501"]
    depends_on:
      mlflow: {condition: service_healthy}

volumes:
  postgres-data:
  minio-data:

networks:
  retail:
