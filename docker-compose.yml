x-runtime: &runtime
  env_file:
    - path: .env
      required: false
  environment:
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minio-local-only}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  networks: [retail]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [retail]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-local-only}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [retail]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/scripts/init-minio.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-local-only}
    volumes: ["./scripts:/scripts:ro"]
    networks: [retail]

  mlflow:
    <<: *runtime
    image: retail-forecasting-mlflow:latest
    build:
      context: .
      target: mlflow
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=localhost:*,mlflow:*,127.0.0.1:*
      - --backend-store-uri=postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow-local-only}@postgres:5432/${POSTGRES_DB:-mlflow}
      - --artifacts-destination=s3://mlflow-artifacts
    ports: ["5000:5000"]
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  spark-master:
    <<: *runtime
    image: retail-forecasting-spark:latest
    build:
      context: .
      target: spark
    command: ["spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    ports: ["7077:7077", "8080:8080"]
    volumes:
      - ./data:/workspace/data:ro
      - ./lakehouse:/workspace/lakehouse

  spark-worker:
    <<: *runtime
    image: retail-forecasting-spark:latest
    build:
      context: .
      target: spark
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 12
      SPARK_WORKER_MEMORY: 12g
    depends_on: [spark-master]
    volumes:
      - ./data:/workspace/data:ro
      - ./lakehouse:/workspace/lakehouse

  pipeline:
    <<: *runtime
    image: retail-forecasting-pipeline:latest
    build:
      context: .
      target: pipeline
    command: ["retail-forecast", "pipeline", "run", "--profile", "dev"]
    volumes:
      - ./data:/workspace/data:ro
      - ./lakehouse:/workspace/lakehouse
      - ./artifacts:/workspace/artifacts
      - ./state:/workspace/state
    depends_on:
      mlflow: {condition: service_healthy}
      spark-master: {condition: service_started}

  pipeline-gpu:
    <<: *runtime
    profiles: [full]
    image: retail-forecasting-pipeline-gpu:latest
    build:
      context: .
      target: pipeline-gpu
    command: ["retail-forecast", "pipeline", "run", "--profile", "full"]
    volumes:
      - ./data:/workspace/data:ro
      - ./lakehouse:/workspace/lakehouse
      - ./artifacts:/workspace/artifacts
      - ./state:/workspace/state
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      mlflow: {condition: service_healthy}
      spark-master: {condition: service_started}

  jupyter:
    <<: *runtime
    image: retail-forecasting-jupyter:latest
    build:
      context: .
      target: jupyter
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--ServerApp.token="]
    ports: ["8888:8888"]
    volumes:
      - ./data:/workspace/data:ro
      - ./lakehouse:/workspace/lakehouse
      - ./artifacts:/workspace/artifacts
      - ./state:/workspace/state
      - ./notebooks:/workspace/notebooks
    depends_on:
      mlflow: {condition: service_healthy}

  jupyter-gpu:
    <<: *runtime
    profiles: [full]
    image: retail-forecasting-jupyter-gpu:latest
    build:
      context: .
      target: jupyter-gpu
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8889", "--no-browser", "--allow-root", "--ServerApp.token="]
    ports: ["8889:8889"]
    volumes:
      - ./data:/workspace/data:ro
      - ./lakehouse:/workspace/lakehouse
      - ./artifacts:/workspace/artifacts
      - ./state:/workspace/state
      - ./notebooks:/workspace/notebooks
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      mlflow: {condition: service_healthy}

  dashboard:
    <<: *runtime
    image: retail-forecasting-dashboard:latest
    build:
      context: .
      target: dashboard
    command: ["streamlit", "run", "app/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["8501:8501"]
    volumes:
      - ./lakehouse:/workspace/lakehouse:ro
      - ./artifacts:/workspace/artifacts:ro
    depends_on:
      mlflow: {condition: service_healthy}

volumes:
  postgres-data:
  minio-data:

networks:
  retail:
